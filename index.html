<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mr. Liquete's Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<style>
:root{--paper:#F4F6F2;--card:#FFFFFF;--ink:#14231E;--muted:#56665F;--line:#D6DED8;--accent:#1E6A55;--accent-ink:#FFFFFF;--accent-soft:#DFEEE7;--bad:#B4372B;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;font-size:16.5px;line-height:1.5}
body{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:18px}
h1{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.15}
p{margin:0;color:var(--muted)}
label{font-weight:700}
input[type=password],input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:17px;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.row input{width:18px;height:18px;accent-color:var(--accent)}
button{min-height:48px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-weight:700;font-size:15px;min-height:1.2em}
.show{background:none;color:var(--accent);min-height:0;font-size:14px;padding:0;align-self:flex-start}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="brand"><div class="mark" aria-hidden="true">ML</div><div><h1>Mr. Liquete's Exam Prep</h1><p style="font-size:14px">Nursing exam review</p></div></div>
  <p>Enter the class password from Mr. Liquete to open your practice exams.</p>
  <div style="display:flex;flex-direction:column;gap:6px"><label for="pw">Class password</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required><button type="button" class="show" id="sh">Show password</button></div>
  <label class="row"><input type="checkbox" id="rm" checked> Remember me on this device</label>
  <button type="submit" id="go">Open exam prep</button>
  <div class="err" id="er" role="alert"></div>
</form>
